[project]
name = "finance-forecast-agent"
version = "0.2.0"
description = "Finance-first autonomous forecasting research harness with reproducibility gates, ReplayLLM, real market data adapters, MLflow/DVC hooks, and US-equity paper fixtures."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "plotly",
  "torch",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ui = ["streamlit"]
tracking = ["mlflow", "dvc"]
data = ["yfinance", "pandas-datareader"]
pdf = ["pypdf"]
native = ["einops", "opt-einsum", "patool", "PyWavelets", "pytorch-wavelets", "reformer-pytorch", "scipy", "tensorboard"]
all = ["pytest", "ruff", "streamlit", "mlflow", "dvc", "yfinance", "pandas-datareader", "pypdf", "einops", "opt-einsum", "patool", "PyWavelets", "pytorch-wavelets", "reformer-pytorch", "scipy", "tensorboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
