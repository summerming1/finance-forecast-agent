name: B4 B5 verified delivery
on:
  push:
    branches: [validation/b0-b5-20260923]
    paths: [.delivery/b4b5-current.json, .github/workflows/b4b5-verified.yml]
permissions:
  contents: read
concurrency:
  group: b4b5-verified-delivery
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.read.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        run: |
          python - <<'PY'
          import json,os,re
          r=json.load(open('.delivery/b4b5-current.json'))
          assert r['stage'] in ('B4','B5') and re.fullmatch('[0-9a-f]{40}',r['base'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('base='+r['base']+'\n')
          PY
  validate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact candidate
        working-directory: target
        run: |
          python ../transport/.delivery/b4b5_apply.py
          mkdir -p validation
          git write-tree > validation/TREE.txt
          git rev-parse HEAD > validation/BASE.txt
          git diff --cached --binary > validation/change.patch
      - name: Install declared dependencies
        working-directory: target
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark]'
      - name: Cumulative and shared regressions
        working-directory: target
        run: |
          python -m pytest -q tests/test_focused*.py tests/test_task_queue*.py tests/test_*memory*.py tests/test_method_card_v3.py tests/test_streamlit_review_gate.py tests/test_p09_review_backlog_timeline.py --junitxml=validation/cumulative.xml
          python -m ruff check src/finance_forecast_agent/focused*.py src/finance_forecast_agent/research_mission.py src/finance_forecast_agent/review_state.py src/finance_forecast_agent/task_queue.py src/finance_forecast_agent/llm_adapters.py src/finance_forecast_agent/replay_llm.py apps/pages/8_Focused_Research.py apps/streamlit_app.py scripts/run_focused*.py scripts/run_research_value_benchmark.py scripts/review_focused_literature.py tests/test_focused*.py tests/browser
          python -m compileall -q src apps scripts tests
          git diff --cached --check
      - name: Save environment
        if: always()
        working-directory: target
        run: |
          mkdir -p validation
          python -m pip freeze > validation/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B45-tests-${{ matrix.python }}-${{ github.run_id }}
          path: target/validation
          retention-days: 14
  browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      FFA_BROWSER_E2E: '1'
      FFA_BROWSER_ARTIFACTS: validation/browser
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact candidate
        working-directory: target
        run: |
          python ../transport/.delivery/b4b5_apply.py
          mkdir -p validation/browser
          git write-tree > validation/browser/TREE.txt
      - name: Install browser environment
        working-directory: target
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark,browser]'
          python -m playwright install --with-deps chromium
      - name: Real Chromium including B4 explicit continuation
        working-directory: target
        run: python -m pytest -q tests/browser --junitxml=validation/browser/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B45-browser-${{ github.run_id }}
          path: target/validation/browser
          retention-days: 14
  publish-blobs:
    needs: [contract,validate,browser]
    if: needs.validate.result == 'success' && needs.browser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - name: Publish only tested immutable content objects
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../transport/.delivery/b4b5_apply.py --publish-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: B45-tested-blobs-${{ github.run_id }}
          path: published
          retention-days: 14
