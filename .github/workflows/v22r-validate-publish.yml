name: V22R staged validation
on:
  push:
    branches: [validation/v22r-publish]
    paths: [.validation/batch.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feat/mission-research-v2
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore and verify exact locally tested commit
        run: python control/.validation/restore.py source control/.validation/batch.json
      - name: Install test environment
        working-directory: source
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo]' optuna
      - name: Cumulative tests
        working-directory: source
        run: |
          mkdir -p validation
          python -m pytest -q tests/test_focused*.py tests/test_task_queue_lineage.py tests/test_p1_benchmark_memory.py tests/test_memory_scheduler.py --junitxml=validation/focused.xml
      - name: Lint and compile
        working-directory: source
        run: |
          python -m ruff check src/finance_forecast_agent/focused*.py src/finance_forecast_agent/research_mission.py src/finance_forecast_agent/task_queue.py src/finance_forecast_agent/experiment_memory.py src/finance_forecast_agent/replay_llm.py src/finance_forecast_agent/llm_adapters.py scripts/run_focused_spy_campaign.py scripts/run_research_value_benchmark.py scripts/probe_focused_failure_semantics.py apps/pages/8_Focused_Research.py tests/test_focused*.py
          python -m compileall -q src scripts apps
      - name: Save tested identity
        if: always()
        working-directory: source
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/HEAD.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          python -m pip freeze > validation/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22r-staged-${{ matrix.python }}-${{ github.sha }}
          path: source/validation
          retention-days: 14
  publish-tested:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feat/mission-research-v2
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact verified tree
        run: python control/.validation/restore.py source control/.validation/batch.json
      - name: Publish temporary tested ref only
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          STAGE=$(python -c "import json; print(json.load(open('../control/.validation/batch.json'))['stage'].lower())")
          git -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin "HEAD:refs/heads/validation/v22r-tested-$STAGE"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
