name: Mission product validation

on:
  push:
    branches: [feat/mission-product-pr0-pr6]
  pull_request:
    branches: [feat/mission-research-v2]

permissions:
  contents: read

concurrency:
  group: mission-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy pandas scikit-learn scipy plotly requests 'exchange-calendars>=4.13,<5' pytest ruff streamlit optuna pyarrow
      - name: Focused regression gate
        run: |
          PYTHONPATH=src python -m pytest tests/test_focused_data_research.py tests/test_focused_streamlit_page.py -q
          PYTHONPATH=src python -m compileall -q src/finance_forecast_agent apps/pages/8_Focused_Research.py
      - name: Preserve exact source snapshot
        if: always()
        run: |
          mkdir -p /tmp/mission-source
          git archive --format=tar.gz --output=/tmp/mission-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/mission-source/HEAD.txt
          python -m pip freeze > /tmp/mission-source/environment.txt
          python -m pip download --dest /tmp/mission-source/wheels streamlit ruff pyarrow 'exchange-calendars>=4.13,<5'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-product-source-${{ github.sha }}
          path: /tmp/mission-source
          retention-days: 7
