name: Focused browser acceptance
on:
  push:
    branches: [feat/mission-research-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FFA_BROWSER_E2E: '1'
      FFA_BROWSER_ARTIFACTS: validation/browser
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared browser environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,byo,benchmark,browser]'
          python -m playwright install --with-deps chromium
      - name: Real browser against real queued worker (simulation only)
        run: |
          mkdir -p validation/browser
          python -m pytest -q tests/browser/test_research_workspace.py --junitxml=validation/browser/browser.xml
      - name: Preserve exact source and environment
        if: always()
        run: |
          mkdir -p validation/browser
          git rev-parse HEAD > validation/browser/HEAD.txt
          git rev-parse HEAD^{tree} > validation/browser/TREE.txt
          python -m pip freeze > validation/browser/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-browser-${{ github.sha }}
          path: validation/browser
          retention-days: 14
