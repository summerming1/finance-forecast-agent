name: B verified delivery
on:
  push:
    branches: [validation/b0-b5-20260923]
    paths: [.delivery/request.json]
permissions:
  contents: read
concurrency:
  group: b-verified-delivery
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.read.outputs.base }}
      stage: ${{ steps.read.outputs.stage }}
      browser: ${{ steps.read.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        run: |
          python - <<'PY'
          import json,os,re
          r=json.load(open('.delivery/request.json'))
          assert re.fullmatch('[0-9a-f]{40}',r['base'])
          assert r['stage'] in ['B0','B1','B2','B3','B4','B5']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('base='+r['base']+'\nstage='+r['stage']+'\nbrowser='+str(r.get('browser',False)).lower()+'\n')
          PY
  validate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact local patch and tree
        working-directory: target
        run: python ../transport/.delivery/apply_and_publish.py
      - name: Install documentation tools
        if: needs.contract.outputs.stage == 'B0'
        run: python -m pip install pytest ruff
      - name: Install declared environment
        if: needs.contract.outputs.stage != 'B0'
        working-directory: target
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark]'
      - name: Documentation gate
        if: needs.contract.outputs.stage == 'B0'
        working-directory: target
        run: |
          mkdir -p validation
          python -m pytest -q tests/test_focused_b0_plan.py --junitxml=validation/gate.xml
          python -m ruff check tests/test_focused_b0_plan.py
          git diff --cached --check
      - name: Cumulative contracts and shared regressions
        if: needs.contract.outputs.stage != 'B0'
        working-directory: target
        run: |
          mkdir -p validation
          python -m pytest -q tests/test_focused*.py tests/test_task_queue*.py tests/test_*memory*.py --junitxml=validation/gate.xml
          python -m ruff check src/finance_forecast_agent/focused*.py src/finance_forecast_agent/llm_adapters.py src/finance_forecast_agent/replay_llm.py src/finance_forecast_agent/research_mission.py src/finance_forecast_agent/task_queue.py tests/test_focused*.py apps/pages/8_Focused_Research.py scripts/run_focused*.py scripts/run_research_value_benchmark.py
          python -m compileall -q src apps scripts tests
          git diff --cached --check
      - name: Preserve tested identity
        if: always()
        working-directory: target
        run: |
          mkdir -p validation
          git write-tree > validation/TREE.txt
          git rev-parse HEAD > validation/BASE.txt
          git diff --cached --binary > validation/change.patch
          python -m pip freeze > validation/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-tests-${{ matrix.python }}-${{ github.run_id }}
          path: target/validation
          retention-days: 14
  browser:
    needs: contract
    if: needs.contract.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FFA_BROWSER_E2E: '1'
      FFA_BROWSER_ARTIFACTS: validation/browser
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: target
        run: |
          python ../transport/.delivery/apply_and_publish.py
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark,browser]'
          python -m playwright install --with-deps chromium
      - working-directory: target
        run: python -m pytest -q tests/browser --junitxml=validation/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-browser-${{ github.run_id }}
          path: target/validation
          retention-days: 14
  publish-blobs:
    needs: [contract,validate,browser]
    if: always() && needs.validate.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.base }}
          path: target
          persist-credentials: false
      - working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../transport/.delivery/apply_and_publish.py --publish-blobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-tested-blobs-${{ github.run_id }}
          path: published
          retention-days: 14
