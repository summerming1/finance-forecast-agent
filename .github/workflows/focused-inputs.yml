name: Focused input acquisition
on:
  push:
    branches: [feat/p1-focused-us-equity-loop]
    paths: [.github/workflows/focused-inputs.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Fixed donor implementation
        run: |
          mkdir -p inputs/donor
          for f in data.py models.py evaluation.py harness.py; do git show bac59862b937bcd0ae99d776fc62007e187f9b3e:src/finance_forecast_agent/$f > inputs/donor/$f; done
      - name: Acquire real SPY chart, never synthesize
        run: |
          python - <<'PY'
          import requests, json, hashlib, pathlib, datetime, time
          root=pathlib.Path('inputs'); root.mkdir(exist_ok=True)
          url='https://query1.finance.yahoo.com/v8/finance/chart/SPY?period1=1262304000&period2=1767225600&interval=1d&events=history'
          errors=[]
          for attempt in range(3):
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=40)
                  r.raise_for_status(); p=r.json(); data=p['chart']['result'][0]
                  assert data['meta']['symbol']=='SPY' and len(data['timestamp'])>3000
                  assert 'adjclose' in data['indicators']
                  (root/'spy_chart_2010_2025.json').write_bytes(r.content)
                  meta={'source_type':'local_real','provider':'Yahoo Finance chart','source_url':r.url,'acquired_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(r.content).hexdigest(),'rows':len(data['timestamp']),'license_status':'provider_terms_review_required','redistribution':'not_committed_to_git','exposure':'historical_development_only','adjustment':'vendor retrospectively adjusted; not institutionally point-in-time'}
                  (root/'spy_source.json').write_text(json.dumps(meta,indent=2))
                  break
              except Exception as e:
                  errors.append(str(e)); time.sleep(3)
          else:
              (root/'acquisition_failure.json').write_text(json.dumps({'errors':errors},indent=2))
              raise RuntimeError('SPY real acquisition failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-real-inputs
          path: inputs
          retention-days: 7
