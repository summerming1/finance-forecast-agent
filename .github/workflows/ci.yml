name: core-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Install CPU test dependencies
        run: |
          pip install numpy pandas scikit-learn plotly 'pytest>=8,<10' 'ruff>=0.6'
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.1'
          pip install -e . --no-deps
      - run: pytest -q
      - run: python scripts/run_finance_agent.py
      - run: ruff check --select F src scripts apps tests
