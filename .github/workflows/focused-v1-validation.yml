name: Focused Mission validation
on:
  push:
    branches: [feat/p1-focused-us-equity-loop-v1, feat/mission-research-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark]'
      - name: Focused tests
        run: |
          mkdir -p validation
          python -m pytest -q tests/test_focused*.py --junitxml=validation/focused.xml
      - name: Focused lint
        run: |
          python -m ruff check src/finance_forecast_agent/focused*.py \
            src/finance_forecast_agent/research_mission.py src/finance_forecast_agent/task_queue.py \
            src/finance_forecast_agent/experiment_memory.py src/finance_forecast_agent/replay_llm.py \
            src/finance_forecast_agent/llm_adapters.py scripts/run_focused_spy_campaign.py \
            scripts/run_research_value_benchmark.py scripts/run_focused_confirmation.py scripts/probe_focused_failure_semantics.py \
            apps/pages/8_Focused_Research.py tests/test_focused*.py
      - name: Compile
        run: python -m compileall -q src/finance_forecast_agent apps/pages/8_Focused_Research.py scripts
      - name: Save validation identity
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/HEAD.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          python -m pip freeze > validation/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-validation-${{ matrix.python-version }}-${{ github.sha }}
          path: validation
          retention-days: 14
