name: Focused Mission validation
on:
  push:
    branches: [feat/p1-focused-us-equity-loop-v1, feat/mission-research-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf]'
      - name: Focused tests
        run: python -m pytest -q tests/test_focused_data_research.py tests/test_focused_streamlit_page.py tests/test_focused_pr1_evidence.py tests/test_focused_pr2_mission.py tests/test_focused_pr3_adaptive.py tests/test_focused_pr4_persistence.py
      - name: Focused lint
        run: |
          python -m ruff check \
            src/finance_forecast_agent/focused_data.py \
            src/finance_forecast_agent/focused_protocol.py \
            src/finance_forecast_agent/focused_research.py \
            src/finance_forecast_agent/focused_evidence.py \
            src/finance_forecast_agent/research_mission.py \
            src/finance_forecast_agent/focused_adaptive.py \
            src/finance_forecast_agent/focused_persistence.py \
            src/finance_forecast_agent/task_queue.py \
            scripts/run_focused_spy_campaign.py \
            scripts/run_research_value_benchmark.py \
            scripts/probe_focused_failure_semantics.py \
            apps/pages/8_Focused_Research.py \
            tests/test_focused_data_research.py \
            tests/test_focused_streamlit_page.py \
            tests/test_focused_pr1_evidence.py \
            tests/test_focused_pr2_mission.py \
            tests/test_focused_pr3_adaptive.py \
            tests/test_focused_pr4_persistence.py
      - name: Compile
        run: python -m compileall -q src/finance_forecast_agent/focused_data.py src/finance_forecast_agent/focused_protocol.py src/finance_forecast_agent/focused_research.py src/finance_forecast_agent/focused_evidence.py src/finance_forecast_agent/research_mission.py src/finance_forecast_agent/focused_adaptive.py src/finance_forecast_agent/focused_persistence.py src/finance_forecast_agent/task_queue.py scripts/run_focused_spy_campaign.py scripts/run_research_value_benchmark.py scripts/probe_focused_failure_semantics.py apps/pages/8_Focused_Research.py
