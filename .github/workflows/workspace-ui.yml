name: Research workspace UI
on:
  push:
    branches: [feat/agent-workspace-ui]
  pull_request:
    branches: [feat/mission-research-v2]
    paths: ['apps/**', 'tests/test_workspace_ui*.py', 'tests/browser/test_agent_workspace.py', '.github/workflows/workspace-ui.yml']
permissions:
  contents: read
jobs:
  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      FFA_BROWSER_E2E: '1'
      FFA_UI_BROWSER_ARTIFACTS: validation/workspace-ui/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve reviewable source identity
        run: |
          mkdir -p validation/workspace-ui
          git rev-parse HEAD > validation/workspace-ui/HEAD.txt
          git rev-parse HEAD^{tree} > validation/workspace-ui/TREE.txt
          git archive --format=zip -o validation/workspace-ui/source.zip HEAD
      - name: Prepare offline UI verification dependencies
        if: hashFiles('tests/test_workspace_ui*.py') == ''
        run: |
          python -m pip download --only-binary=:all: 'streamlit>=1.64,<2' ruff -d validation/workspace-ui/wheelhouse
      - name: Install existing declared environment
        if: hashFiles('tests/test_workspace_ui*.py') != ''
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo,benchmark,browser]'
          python -m playwright install --with-deps chromium
      - name: Verify workspace adapter and real browser
        if: hashFiles('tests/test_workspace_ui*.py') != ''
        run: |
          python -m pytest -q tests/test_workspace_ui*.py tests/browser/test_agent_workspace.py --junitxml=validation/workspace-ui/ui.xml
          python -m ruff check apps/workspace_ui*.py tests/test_workspace_ui*.py tests/browser/test_agent_workspace.py
          python -m compileall -q apps
          python -m pip freeze > validation/workspace-ui/environment.txt
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-${{ github.sha }}
          path: validation/workspace-ui
          retention-days: 7
