name: Focused final acceptance

on:
  push:
    branches: [feat/mission-research-v2]
  workflow_dispatch:
    inputs:
      frozen_input_run_id:
        description: 'Run containing original, hash-identical focused-real-inputs; never freshly substituted prices'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  real-spy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      FFA_DELIVERY_STATE_DB: /tmp/final-real-spy/runtime.sqlite3
      FROZEN_INPUT_RUN_ID: ${{ inputs.frozen_input_run_id || vars.FFA_FROZEN_INPUT_RUN_ID || '35204186327' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record input contract and source identity
        run: |
          mkdir -p validation/frozen-spy
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          run=os.environ['FROZEN_INPUT_RUN_ID']
          assert re.fullmatch('[1-9][0-9]*',run), 'explicit positive frozen artifact run ID required'
          identity={'input_run_id':run,'artifact_name':'focused-real-inputs',
                    'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'tree':subprocess.check_output(['git','write-tree'],text=True).strip(),
                    'expected_raw_sha256':'5fb282f6278d14000592e0e432fe69a5c00fdb6f7b48cbb56368fc0e3185bbcd'}
          Path('validation/frozen-spy/identity.json').write_text(json.dumps(identity,indent=2))
          PY
      - name: Download frozen audited SPY inputs
        id: frozen_inputs
        uses: actions/download-artifact@v4
        with:
          name: focused-real-inputs
          path: /tmp/focused-real-inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_INPUT_RUN_ID }}
      - name: Install focused dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf,byo]'
          python -m pip freeze > validation/frozen-spy/environment.txt
      - name: Verify original input hash before any training
        run: python scripts/verify_frozen_spy_acceptance.py --inputs /tmp/focused-real-inputs --check-input-only --receipt validation/frozen-spy/input.json
      - name: Run current HEAD on frozen real SPY data
        run: |
          RAW="$(find /tmp/focused-real-inputs -name spy_chart_2010_2025.json -print -quit)"
          META="$(find /tmp/focused-real-inputs -name spy_source.json -print -quit)"
          python scripts/run_focused_spy_campaign.py --project-dir /tmp/final-real-spy --raw-spy-json "$RAW" --source-metadata "$META" --advisor-mode deterministic --rounds 3 --candidates-per-round 2 --max-fit-calls 40 > validation/frozen-spy/campaign.log
      - name: Recompute predictions and verify package and new-process model inference
        run: |
          CAMPAIGN="$(find /tmp/final-real-spy/focused_campaigns -name campaign.json -print -quit)"
          test -n "$CAMPAIGN"
          python scripts/verify_frozen_spy_acceptance.py --inputs /tmp/focused-real-inputs --campaign-root "$(dirname "$CAMPAIGN")" --state-db "$FFA_DELIVERY_STATE_DB" --output-dir /tmp/frozen-spy-audit --receipt validation/frozen-spy/audit.json
      - name: Preserve blocked download without converting job failure into success
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.frozen_inputs.outcome }}
        run: |
          mkdir -p validation/frozen-spy
          python - <<'PY'
          import json,os
          from pathlib import Path
          outcome=os.environ['DOWNLOAD_OUTCOME']
          Path('validation/frozen-spy/input_acquisition.json').write_text(json.dumps({
              'input_run_id':os.environ['FROZEN_INPUT_RUN_ID'],'download_outcome':outcome,
              'status':'ACQUIRED_PENDING_CONTENT_CHECK' if outcome=='success' else 'BLOCKED_ASSET',
              'replacement_data_used':False,'financial_confirmation':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-frozen-spy-${{ github.sha }}-${{ github.run_attempt }}
          path: validation/frozen-spy
          retention-days: 14
          if-no-files-found: error
