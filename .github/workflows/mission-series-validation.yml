name: Mission PR series validation
on:
  push:
    branches: ['feat/mission-pr*-20260920']
  pull_request:
    branches: ['feat/mission-research-v2', 'feat/mission-pr*-20260920']
permissions:
  contents: read
concurrency:
  group: mission-series-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source (no credentials or untracked files)
        run: git archive --format=tar.gz -o source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mission-source-${{ github.sha }}
          path: source-snapshot.tar.gz
          retention-days: 7
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ui,pdf]' optuna pyarrow
      - name: Permanent regression and current Mission gates
        run: |
          if test -f scripts/check_mission_gate.py; then
            python scripts/check_mission_gate.py --junit mission-junit.xml
          else
            python -m pytest -q tests/test_focused_data_research.py tests/test_focused_streamlit_page.py --junitxml=mission-junit.xml
            python -m ruff check src/finance_forecast_agent/focused_data.py src/finance_forecast_agent/focused_protocol.py src/finance_forecast_agent/focused_research.py apps/pages/8_Focused_Research.py
          fi
          python -m compileall -q src/finance_forecast_agent apps scripts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-tests-py${{ matrix.python-version }}-${{ github.sha }}
          path: mission-junit.xml
          retention-days: 14
  offline-test-dependencies:
    if: github.ref == 'refs/heads/feat/mission-pr0-contracts-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare wheels for the isolated local test environment
        run: python -m pip wheel 'streamlit>=1.45,<2' ruff 'mlflow-skinny>=3,<4' dvc exchange-calendars optuna pyarrow --wheel-dir wheels
      - uses: actions/upload-artifact@v4
        with:
          name: mission-offline-wheels-py313
          path: wheels
          retention-days: 7
