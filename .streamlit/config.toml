[theme]
base = "dark"
primaryColor = "#14b8a6"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#121922"
textColor = "#e5e7eb"
linkColor = "#67e8f9"
borderColor = "#283341"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["38px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#14b8a6", "#67e8f9", "#f59e0b", "#a78bfa", "#f87171", "#94a3b8"]
greenColor = "#22c55e"
orangeColor = "#f59e0b"
redColor = "#f87171"
blueColor = "#38bdf8"

[theme.sidebar]
backgroundColor = "#0f151d"
secondaryBackgroundColor = "#18212c"
borderColor = "#283341"
